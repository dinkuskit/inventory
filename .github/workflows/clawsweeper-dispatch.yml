name: ClawSweeper dispatch

# Native events are independent of CI and agent-owned OpenClaw review.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open pull request number
        required: true
        type: string
      publish:
        description: Publish the native review and state
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  bind:
    if: >-
      vars.CLAWSWEEPER_SPARK_ENABLED == 'true' &&
      (github.event_name != 'pull_request_target' ||
       github.event.action != 'edited' ||
       toJSON(github.event.changes) != '{}') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
         github.event.comment.user.id == github.event.issue.user.id) &&
        contains(github.event.comment.body, '@clawsweeper')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      requested: ${{ steps.live.outputs.requested }}
      pr_number: ${{ steps.live.outputs.pr_number }}
      base_sha: ${{ steps.live.outputs.base_sha }}
      head_sha: ${{ steps.live.outputs.head_sha }}
      publish: ${{ steps.live.outputs.publish }}
    steps:
      - name: Bind the native event to the current PR
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: dinkuskit/inventory
          TARGET_ID: '1307843786'
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYBIND'
          import json, os, re, subprocess
          from pathlib import Path
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          def skip():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('requested=false\n')
              raise SystemExit(0)
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind = os.environ['GITHUB_EVENT_NAME']
          if kind == 'pull_request_target' and event.get('action') == 'edited' and not event.get('changes'):
              skip()
          if kind == 'issue_comment':
              comment = event['comment']
              if not event['issue'].get('pull_request') or comment['user']['type'] == 'Bot': skip()
              body = comment.get('body', '')
              if not isinstance(body, str) or len(body) > 65536: skip()
              commands = [match.group(1).lower() for line in body.splitlines()
                          if (match := re.fullmatch(r'\s*@clawsweeper\s+(review|re-review|re-run)\s*', line, re.I))]
              if len(commands) != 1: skip()
          target = os.environ['TARGET_REPO']
          repo = get('repos/' + target)
          if str(repo['id']) != os.environ['TARGET_ID']: raise SystemExit('Repository identity changed')
          number = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number): raise SystemExit('Invalid PR number')
          pull = get(f'repos/{target}/pulls/{number}')
          if pull['state'] != 'open' or pull['draft']: skip()
          if kind == 'issue_comment':
              maintainer = comment.get('author_association') in {'OWNER', 'MEMBER', 'COLLABORATOR'}
              actor = comment['user'].get('login', '').lower()
              author = pull.get('user', {}).get('login', '').lower()
              author_rerun = bool(actor) and actor == author and commands[0] in {'re-review', 're-run'}
              if not maintainer and not author_rerun: skip()
          if pull['base']['repo']['id'] != repo['id'] or pull['base']['ref'] != repo['default_branch']: skip()
          base = get(f"repos/{target}/git/ref/heads/{repo['default_branch']}")['object']['sha']
          head = pull['head']['sha']
          if any(not re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)): raise SystemExit('Invalid source tuple')
          if base != pull['base']['sha']: raise SystemExit('Base moved during admission')
          publish = 'true' if kind != 'workflow_dispatch' else os.environ['MANUAL_PUBLISH']
          # Author-only reruns refresh evidence without publication authority.
          if kind == 'issue_comment' and not maintainer: publish = 'false'
          if publish not in {'true', 'false'}: raise SystemExit('Invalid publication mode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'requested=true\npr_number={number}\nbase_sha={base}\nhead_sha={head}\npublish={publish}\n')
          PYBIND
      - name: Mint the pickup token
        id: pickup-token
        if: ${{ steps.live.outputs.requested == 'true' && vars.CLAWSWEEPER_APP_CLIENT_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: dinkuskit
          repositories: inventory
          permission-issues: write
          permission-pull-requests: write
      - name: Post the pickup comment
        if: ${{ steps.live.outputs.requested == 'true' && steps.pickup-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pickup-token.outputs.token }}
          TARGET_REPO: dinkuskit/inventory
          PR_NUMBER: ${{ steps.live.outputs.pr_number }}
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYPICKUP'
          import json, os, re, subprocess
          repo = os.environ['TARGET_REPO']
          pr = os.environ['PR_NUMBER']
          head = os.environ['HEAD_SHA']
          if not re.fullmatch(r'[1-9][0-9]*', pr) or not re.fullmatch(r'[0-9a-f]{40}', head):
              raise SystemExit(0)
          marker = f'<!-- clawsweeper-pickup item={pr} -->'
          body = (
              '\U0001F440 ClawSweeper picked this up and is waiting for a review slot.\n\n'
              f'Head: `{head}`.\n\n'
              'This is a progress receipt, not review clearance. The final review is published separately.\n\n'
              + marker
          )
          payload = json.dumps({'body': body}).encode()
          raw = subprocess.check_output(['gh', 'api', '--paginate', f'repos/{repo}/issues/{pr}/comments?per_page=100'])
          comments = json.loads(raw.decode() or '[]')
          if not isinstance(comments, list):
              comments = [comments]
          existing = next((c.get('id') for c in comments if isinstance(c, dict) and marker in (c.get('body') or '')), None)
          if existing:
              subprocess.check_call(['gh', 'api', '-X', 'PATCH', f'repos/{repo}/issues/comments/{existing}', '--input', '-'], input=payload)
          else:
              subprocess.check_call(['gh', 'api', '-X', 'POST', f'repos/{repo}/issues/{pr}/comments', '--input', '-'], input=payload)
          PYPICKUP

  review:
    needs: bind
    if: needs.bind.outputs.requested == 'true'
    concurrency:
      group: ${{ github.repository }}-clawsweeper-dispatch-${{ needs.bind.outputs.pr_number }}
      cancel-in-progress: true
    permissions: {}
    uses: dinkuskit/clawsweeper/.github/workflows/dinkuskit-native-canary.yml@d01c55c5faf57b09d08de55fe55581cdfa3f8352
    with:
      target_repository: inventory
      target_repository_id: '1307843786'
      pr_number: ${{ needs.bind.outputs.pr_number }}
      expected_base_sha: ${{ needs.bind.outputs.base_sha }}
      expected_head_sha: ${{ needs.bind.outputs.head_sha }}
      publish: ${{ needs.bind.outputs.publish == 'true' }}
    secrets:
      CLAWSWEEPER_DISPATCH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
