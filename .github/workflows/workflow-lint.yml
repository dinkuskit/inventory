name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: zizmor
        run: pipx run zizmor==1.11.0 --offline --config .github/zizmor.yml .github/workflows/*.yml
      # pull_request_target and issue_comment jobs may hand secrets to a
      # reusable workflow only behind a permission-gate step.
      - name: Secret-bearing trigger gate
        run: |
          node scripts/check-workflow-secret-gates.mjs
          node --test tests/workflows/workflow-secret-gate.test.mjs
